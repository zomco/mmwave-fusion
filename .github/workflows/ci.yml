name: CI

on:
  push:
    branches: [main]
  pull_request:
  # HACS and hassfest both validate against moving targets — a HACS rule change
  # or a Home Assistant release can break this repository without a commit
  # landing here. The nightly run is how that gets noticed.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Home Assistant's own manifest and translation checks. This is the one that
  # catches a malformed manifest.json, a missing translation key, or a
  # dependency that does not exist — the class of error that otherwise shows up
  # as an integration that silently fails to load.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Required before HACS will list the integration. Reports rather than blocks,
  # because two of its nine checks cannot pass from inside this repository yet:
  #
  #   topics  — the repository has none. A settings change, not a code change.
  #   brands  — an integration must be registered in home-assistant/brands,
  #             which means a PR to that repository and waiting for review.
  #             mmwave-card is exempt only because brands applies to
  #             integrations, not to frontend plugins.
  #
  # Leaving it blocking would fail every pull request here until an external
  # review lands. Leaving it out entirely would lose the checklist. So it runs,
  # it reports, and this comment records what has to happen before the
  # continue-on-error comes back off.
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
