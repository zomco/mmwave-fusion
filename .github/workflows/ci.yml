name: CI

on:
  push:
    branches: [main]
  pull_request:
  # HACS and hassfest both validate against moving targets — a HACS rule change
  # or a Home Assistant release can break this repository without a commit
  # landing here. The nightly run is how that gets noticed.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Home Assistant's own manifest and translation checks. This is the one that
  # catches a malformed manifest.json, a missing translation key, or a
  # dependency that does not exist — the class of error that otherwise shows up
  # as an integration that silently fails to load.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Required before HACS will list the integration.
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
